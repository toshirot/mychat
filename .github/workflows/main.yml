name: mychat-workflow
on:
  push:
jobs:
  mychat:
    name: mychat
    runs-on: ubuntu-latest
    steps:
      # ...
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      # run any `bun` or `bunx` command
      - run: bun install
      - run: sudo su
      - run: ls -l /home/runner/
      - run: ls -l /home/runner/runners/
      - run: bun run --hot ~/bun/elysia/mychat/src/index-9012.tsx
      - run: bun run build
