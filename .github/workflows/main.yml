name: mychat-workflow
jobs:
  mychat:
    name: mychat
    runs-on: ubuntu-latest
    steps:
      # ...
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version:"latest"
      # run any `bun` or `bunx` command
      - run: bun install
      - run: bun index.ts
      - run: bun run build
